# ══════════════════════════════════════════════════════════════
# P0 复现测试运行须知（tests/test_smoke_p0.py）
#
# 必须用项目根目录的干净解释器 _clean_venv 运行，并显式清掉
# OPENAI_API_KEY（项目根目录、bash 下）：
#
#     env -u OPENAI_API_KEY PYTHONIOENCODING=utf-8 _clean_venv/Scripts/python.exe -m pytest -v
#
# （PYTHONIOENCODING=utf-8 只影响 pytest 输出的编码——中文 Windows
#   控制台默认 GBK，会把测试报告里的中文打成乱码；不影响测试结果。）
#
# 注意：不要用 .venv 跑——那是本机「脏」环境，会掩盖要复现的问题：
#   1. .venv 里装了 langgraph-checkpoint-sqlite
#      → test_langgraph_sqlite_checkpointer_available 虚假通过
#   2. .venv 的运行环境可能设置了 OPENAI_API_KEY
#      → test_vector_store_imports_without_openai_key 的复现前提被破坏
#
# 说明：pythonpath 选项需要 pytest>=7（requirements-dev.txt 锁定
# pytest~=9.1.1，满足）。
# ══════════════════════════════════════════════════════════════

[pytest]
pythonpath = .
testpaths = tests
